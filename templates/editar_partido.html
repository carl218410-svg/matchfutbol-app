{% extends "base.html" %}
{% block content %}
  <a href="{{ url_for('ver_partido', partido_id=partido.id) }}" class="back-link">← Volver al partido</a>
  <div class="card" style="max-width:620px; margin:0 auto;">
    <h1>Editar partido</h1>
    <p class="muted">Si cambias cancha, fecha u hora, se les avisa a los ya inscritos.</p>
    <form method="post">
      <label>Categoría</label>
      <select name="categoria" required>
        <option value="masculino" {{ 'selected' if partido.categoria == 'masculino' }}>♂ Fútbol masculino</option>
        <option value="femenino" {{ 'selected' if partido.categoria == 'femenino' }}>♀ Fútbol femenino</option>
        <option value="mixto" {{ 'selected' if partido.categoria == 'mixto' }}>⚥ Mixto</option>
      </select>
      <div class="row">
        <div>
          <label>Cancha</label>
          <input name="cancha" value="{{ partido.cancha }}" required>
        </div>
        <div>
          <label>Distrito</label>
          <input name="distrito" value="{{ partido.distrito }}" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Fecha</label>
          <input type="date" name="fecha" value="{{ partido.fecha }}" required>
        </div>
        <div>
          <label>Hora</label>
          <input type="time" name="hora" value="{{ partido.hora }}" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Precio jugador (S/)</label>
          <input type="number" step="0.5" name="precio_jugador" value="{{ partido.precio_jugador }}" required>
        </div>
        <div>
          <label>Precio arquero (S/)</label>
          <input type="number" step="0.5" name="precio_arquero" value="{{ partido.precio_arquero }}" required>
        </div>
      </div>
      <div style="margin-top:20px">
        <button class="btn block" type="submit">Guardar cambios</button>
      </div>
    </form>
  </div>
{% endblock %}
